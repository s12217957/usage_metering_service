services:
  postgres:
    image: postgres:17
    container_name: usage-metering-postgres
    environment:
      POSTGRES_DB: usage_metering
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d usage_metering"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:dev_password@postgres:5432/usage_metering
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(3000, '127.0.0.1').on('connect', function(){process.exit(0)}).on('error', function(){process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  example:
    build: .
    command: ["node", "example-client/demo.js"]
    environment:
      BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: