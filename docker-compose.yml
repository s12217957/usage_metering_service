services:
  postgres:
    image: postgres:17
    container_name: usage-metering-postgres
    environment:
      POSTGRES_DB: usage_metering
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev_password
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d usage_metering"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: